<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Frog Hop</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0c1412; touch-action: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
    #game-container { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
    #game-container canvas { max-width: 100vw; max-height: 100vh; max-height: 100dvh; width: auto; height: auto; image-rendering: pixelated; }
    @media (max-aspect-ratio: 7/3) { #game-container canvas { width: 100vw; height: auto; } }
    @media (min-aspect-ratio: 7/3) { #game-container canvas { height: 100vh; height: 100dvh; width: auto; } }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
  <script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>
</head>
<body>
  <div id="game-container"></div>
  <script src="sketch.js"></script>
</body>
</html>
