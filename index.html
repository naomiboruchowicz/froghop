<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Frog Hop</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0c1412; touch-action: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
    #game-container { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
    #game-container canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      width: min(100vw, calc(100dvh * 7 / 4)) !important;
      height: min(100dvh, calc(100vw * 4 / 7)) !important;
      display: block !important;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
  <script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>
</head>
<body>
  <div id="game-container"></div>
  <script src="sketch.js"></script>
</body>
</html>
